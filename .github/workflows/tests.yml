name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: PortAudio (Linux only; the macOS/Windows wheels bundle it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install
        run: pip install . pytest
      - name: Tests
        run: pytest -v tests
      - name: Entry point and PortAudio load
        run: |
          pyquicklook --help
          python -c "import sounddevice; print(sounddevice.get_portaudio_version())"
