name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: PortAudio (Linux only; the macOS/Windows wheels bundle it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install
        run: pip install . pytest
      - name: Tests
        run: pytest -v tests
      - name: Entry point and PortAudio load
        shell: bash
        run: |
          pyquicklook --help
          python - <<'PY'
          # A missing PortAudio library raises OSError on import. CI runners
          # have no sound server, so PortAudio loading but failing to
          # initialize (PortAudioError) still means the library is installed.
          try:
              import sounddevice
              print(sounddevice.get_portaudio_version())
          except OSError:
              raise
          except Exception as e:
              print("PortAudio loaded, but no audio server here:", e)
          PY
