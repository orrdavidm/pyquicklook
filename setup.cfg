[metadata]
name = pyquicklook
version = 0.1.0
author = Your Name
author_email = you@example.com
description = Real-time audio visualizer (waveform, spectrum, waterfall)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/pyquicklook
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
python_requires = >=3.10
install_requires =
    numpy
    matplotlib
    sounddevice
    scipy

[options.entry_points]
console_scripts =
    pyquicklook = pyquicklook:main
