[metadata]
name = pyquicklook
version = 0.1.0
author = David Orr
description = Real-time I/Q quicklook for stereo sound-card captures (port of quicklook_complex.m)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/orrdavidm/pyquicklook
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
python_requires = >=3.10
py_modules = pyquicklook
install_requires =
    numpy
    matplotlib
    sounddevice
    scipy

[options.extras_require]
qt = PyQt6

[options.entry_points]
console_scripts =
    pyquicklook = pyquicklook:main
